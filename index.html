<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatório Fiocruz | Painel Integrado de Indicadores de Desempenho</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0b3448;
  --blue:#14536d;
  --teal:#008c8c;
  --teal-bright:#00a6a6;
  --cyan:#63d0cd;
  --amber:#e69b28;
  --green:#2f8f6f;
  --red:#c95244;
  --bg:#f2f6f8;
  --card:#ffffff;
  --ink:#162d38;
  --muted:#5c737d;
  --line:#d5e1e6;
  --soft:#e8f3f4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Aptos,Arial,sans-serif;-webkit-font-smoothing:antialiased}

.topbar{background:var(--navy);color:#fff;padding:14px 28px;border-bottom:4px solid var(--teal-bright);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.brand-area{display:flex;align-items:center;gap:16px}
.fiocruz-badge{background:#ffffff14;border:1px solid #ffffff30;padding:8px 12px;border-radius:6px;font-weight:800;font-size:13px;letter-spacing:1.2px;color:var(--cyan)}
.title-group h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-0.2px}
.title-group p{margin:3px 0 0;font-size:12px;color:#cbe0e8}
.meta-pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta-pill{font-size:11px;background:#ffffff12;border:1px solid #ffffff28;padding:6px 11px;border-radius:6px;color:#e4f1f5}
.btn-export{background:var(--teal-bright);color:#fff;border:none;padding:7px 13px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s}
.btn-export:hover{background:#009191}

.subbanner{background:#e3eef2;border-bottom:1px solid var(--line);padding:7px 28px;font-size:11px;color:var(--blue);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.container{max-width:1540px;margin:0 auto;padding:18px 26px 36px}

.filter-bar{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(11,52,72,.04);display:grid;grid-template-columns:1.3fr 1.3fr 1fr 0.9fr 0.7fr auto;gap:12px;align-items:end}
.f-group label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}
.f-group select,.f-group input{width:100%;height:36px;border:1px solid #c5d5dc;border-radius:6px;padding:0 10px;font-size:12px;color:var(--ink);background:#fbfdfe}
.f-group select:focus,.f-group input:focus{outline:none;border-color:var(--teal-bright);background:#fff}
.f-actions{display:flex;gap:6px}
.btn{height:36px;padding:0 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:none}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--navy)}
.btn-ghost{background:#f0f5f7;color:var(--navy);border:1px solid #c5d5dc}
.btn-ghost:hover{background:#e2ecef}

/* Barra de Eixos Estratégicos (7 colunas) */
.axis-bar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.axis-pill{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 8px;text-align:center;cursor:pointer;transition:.15s;box-shadow:0 2px 6px rgba(11,52,72,.02)}
.axis-pill:hover{border-color:var(--teal-bright);background:#f7fcfd;transform:translateY(-1px)}
.axis-pill.active{background:var(--navy);border-color:var(--navy);color:#fff}
.axis-pill.active .axis-title,.axis-pill.active .axis-count{color:#fff}
.axis-title{font-size:10px;font-weight:700;color:var(--navy);display:block;line-height:1.2}
.axis-count{font-size:10px;font-weight:600;color:var(--muted);display:block;margin-top:2px}

.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(11,52,72,.04)}
.kpi-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--teal)}
.kpi-card.good::before{background:var(--green)}
.kpi-card.warn::before{background:var(--amber)}
.kpi-card.bad::before{background:var(--red)}
.kpi-card.navy::before{background:var(--navy)}
.kpi-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi-val{font-size:28px;font-weight:800;color:var(--navy);margin:6px 0 3px;line-height:1.1}
.kpi-sub{font-size:11px;color:var(--muted)}

.viz-grid-main{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.viz-grid-sub{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;box-shadow:0 2px 8px rgba(11,52,72,.04)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
.card-title{font-size:15px;font-weight:700;color:var(--navy);margin:0}
.card-subtitle{font-size:11px;color:var(--muted);margin:3px 0 0}
.badge-info{font-size:10px;font-weight:700;background:var(--soft);color:var(--blue);padding:4px 8px;border-radius:4px;white-space:nowrap}

.bullet-list{display:grid;gap:15px;margin-top:14px;max-height:420px;overflow-y:auto;padding:6px 4px 4px 0}
.bullet-item{display:grid;grid-template-columns:220px 1fr 72px;align-items:center;gap:12px;font-size:12px}
.bullet-label{font-weight:600;color:var(--ink);line-height:1.25}
.bullet-label small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.bullet-track{height:20px;background:#e8eff2;border-radius:4px;position:relative}
.bullet-fill{height:100%;border-radius:4px;transition:width .4s ease}
.bullet-target{position:absolute;left:40%;top:-4px;bottom:-4px;width:2.5px;background:var(--navy);z-index:2}
.bullet-target::after{content:"100%";position:absolute;top:-14px;left:-11px;font-size:9px;font-weight:800;color:var(--navy)}
.bullet-val{text-align:right;font-weight:800;font-size:13px;color:var(--navy)}

.table-clean{width:100%;border-collapse:collapse;font-size:12px}
.table-clean th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);background:#f7fafb}
.table-clean td{padding:9px 10px;border-bottom:1px solid #edf2f5;vertical-align:middle}
.table-clean tr:hover td{background:#f8fbfc}
.pill{display:inline-block;padding:3px 9px;border-radius:50px;font-size:10px;font-weight:800;color:#fff;white-space:nowrap}
.pill.partial{background:var(--amber)}
.pill.no{background:var(--red)}
.pill.yes{background:var(--green)}

.chain-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:10px}
.chain-step{border-radius:7px;padding:12px 6px;text-align:center;border:1px solid var(--line);background:#f6fafb;transition:.2s;cursor:pointer;position:relative}
.chain-step:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(11,52,72,.08)}
.chain-step.active-elo{outline:2.5px solid var(--navy);outline-offset:1px;background:#fff}
.chain-step .st-num{font-size:9px;font-weight:800;color:var(--muted);margin-bottom:4px}
.chain-step .st-name{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:3px}
.chain-step .st-desc{display:block;font-size:9px;color:var(--muted);margin-bottom:5px;line-height:1.15}
.chain-step .st-status{font-size:10px;font-weight:700}
.chain-step.ok{background:#e7f5ef;border-color:#b2decb}
.chain-step.ok .st-status{color:var(--green)}
.chain-step.part{background:#fef6e7;border-color:#f3d59b}
.chain-step.part .st-status{color:#b8740e}
.chain-step.miss{background:#fdeceb;border-color:#efb9b3}
