name: Atualizar Dados e Auditoria IA - Painel Fiocruz

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pandas openpyxl requests beautifulsoup4 google-genai

      - name: Executar coletor e auditoria de IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python coletor.py

      - name: Salvar alterações no repositório
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add parecer_ia.json
          git commit -m "Atualização automática dos indicadores e parecer IA" || exit 0
          git push
